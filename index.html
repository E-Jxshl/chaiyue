<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="柴悦 · 个人简历">
<title>柴悦 · 个人简历</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e8b23a'/><text x='50' y='68' font-size='54' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'>C</text></svg>">
<style>
  :root{
    --bg:#f6f5f2;
    --paper:#ffffff;
    --ink:#1c1c1a;
    --muted:#8b8b85;
    --line:#e8e7e2;
    --accent:#e0a92e;
    --accent-soft:#fdf6e3;
    --bar:56px;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ---------- 顶部栏 ---------- */
  .bar{
    position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:50;
    display:flex;align-items:center;gap:14px;
    padding:0 18px;
    background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .mark{
    width:26px;height:26px;border-radius:8px;flex:0 0 auto;
    background:linear-gradient(145deg,#f3c65c,#e0a92e);
    color:#fff;font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    letter-spacing:.5px;
  }
  .title{
    font-size:14px;font-weight:600;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .title small{
    font-weight:400;color:var(--muted);font-size:12px;margin-left:8px;
    letter-spacing:.5px;
  }
  .spacer{flex:1 1 auto;}
  .counter{
    font-size:12px;color:var(--muted);
    font-variant-numeric:tabular-nums;
    padding:5px 10px;border-radius:999px;
    background:var(--accent-soft);color:#9a7418;
    white-space:nowrap;
  }
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    height:32px;padding:0 13px;border-radius:999px;
    font-size:12.5px;font-weight:500;text-decoration:none;
    color:var(--ink);background:#fff;
    border:1px solid var(--line);
    transition:.18s ease;
    white-space:nowrap;
  }
  .btn:hover{border-color:#d9d8d2;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn.primary:hover{background:#000;}
  .btn svg{width:13px;height:13px;flex:0 0 auto;}
  .progress{
    position:absolute;left:0;bottom:-1px;height:2px;width:0%;
    background:var(--accent);transition:width .25s ease;border-radius:0 2px 2px 0;
  }

  /* ---------- 文档区 ---------- */
  main{
    padding:calc(var(--bar) + 22px) 16px 60px;
  }
  .pages{
    max-width:880px;margin:0 auto;
    display:flex;flex-direction:column;align-items:center;gap:18px;
  }
  .page{
    width:100%;
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 26px rgba(0,0,0,.06);
    overflow:hidden;
    position:relative;
    min-height:240px;
  }
  .page canvas{display:block;width:100%;height:auto;}
  .page.skeleton::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(100deg,#f4f3ef 30%,#fbfaf7 50%,#f4f3ef 70%);
    background-size:220% 100%;
    animation:shimmer 1.4s linear infinite;
  }
  @keyframes shimmer{from{background-position:180% 0;}to{background-position:-40% 0;}}

  /* ---------- 加载 / 错误 ---------- */
  .status{
    position:fixed;inset:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:var(--bg);
    transition:opacity .35s ease,visibility .35s ease;
  }
  .status.hide{opacity:0;visibility:hidden;}
  .spinner{
    width:26px;height:26px;border-radius:50%;
    border:2.5px solid #e6e4dd;border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .status p{margin:0;font-size:13px;color:var(--muted);letter-spacing:.6px;}
  .error-box{
    max-width:340px;text-align:center;padding:0 24px;
    font-size:13.5px;line-height:1.7;color:#555;
  }
  .error-box .oops{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .error-box a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--accent);padding-bottom:1px;}

  /* ---------- 页脚 ---------- */
  footer{
    max-width:880px;margin:26px auto 0;text-align:center;
    font-size:11.5px;color:#a5a49e;letter-spacing:.6px;
  }
  footer a{color:#8b8b85;text-decoration:none;border-bottom:1px solid #dedcd6;}

  @media (max-width:640px){
    .title small{display:none;}
    .btn .label{display:none;}
    .btn{padding:0 10px;}
    main{padding-left:10px;padding-right:10px;padding-bottom:40px;}
    .pages{gap:12px;}
    :root{--radius:10px;}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <div class="mark">C</div>
    <div class="title">柴悦 <small>个人简历</small></div>
  </div>
  <div class="spacer"></div>
  <div class="counter" id="counter" hidden>— / —</div>
  <a class="btn" href="resume.pdf" target="_blank" rel="noopener" title="在新标签页打开原文件">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
    <span class="label">原文件</span>
  </a>
  <a class="btn primary" href="resume.pdf" download="柴悦-个人简历.pdf" title="下载 PDF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    <span class="label">下载</span>
  </a>
  <div class="progress" id="progress"></div>
</header>

<div class="status" id="status">
  <div class="spinner" id="spinner"></div>
  <p id="statusText">正在加载简历…</p>
</div>

<main>
  <div class="pages" id="pages"></div>
  <footer>
    在线预览 · 共 <span id="totalPages">—</span> 页 &nbsp;|&nbsp; <a href="resume.pdf" download="柴悦-个人简历.pdf">下载原始 PDF</a>
  </footer>
</main>

<!-- pdf.js 优先走 jsDelivr（国内快），失败则回退到本站 vendor 目录 -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
  var PDFJS_FROM_CDN = typeof pdfjsLib !== 'undefined';
  if (!PDFJS_FROM_CDN) {
    document.write('<script src="vendor/pdf.min.js"><\/script>');
  }
</script>
<script>
(function () {
  var pagesEl   = document.getElementById('pages');
  var statusEl  = document.getElementById('status');
  var statusTxt = document.getElementById('statusText');
  var progress  = document.getElementById('progress');
  var counter   = document.getElementById('counter');
  var totalEl   = document.getElementById('totalPages');
  var spinner   = document.getElementById('spinner');

  var PDF_URL = 'resume.pdf';
  var PDF_MIRRORS = [
    'https://cdn.jsdelivr.net/gh/E-Jxshl/chaiyue@main/resume.pdf',
    'resume.pdf'
  ];
  var pdfDoc = null;
  var rendering = false;
  var resizeTimer = null;

  function contentWidth() {
    return Math.max(280, pagesEl.clientWidth || window.innerWidth - 32);
  }

  function hideStatus() {
    statusEl.classList.add('hide');
    spinner.style.display = 'none';
  }

  function showError(msg) {
    spinner.style.display = 'none';
    statusTxt.innerHTML =
      '<span style="display:block;font-size:15px;font-weight:600;color:#1c1c1a;margin-bottom:8px;">暂时无法在线预览</span>' +
      msg;
    statusEl.classList.remove('hide');
  }

  /* 兜底方案：浏览器原生 PDF 渲染 */
  function nativeFallback() {
    try {
      pagesEl.innerHTML =
        '<iframe src="' + PDF_URL + '#view=FitH" title="简历 PDF" ' +
        'style="width:100%;height:calc(100vh - 120px);border:0;border-radius:12px;background:#fff;"></iframe>';
      document.getElementById('counter').hidden = true;
      totalEl.textContent = '?';
      if (typeof pdfjsLib === 'undefined') {
        statusEl.classList.add('hide');
      }
    } catch (e) {}
  }

  function renderAll() {
    if (!pdfDoc || rendering) return;
    rendering = true;

    var w = contentWidth();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    pagesEl.innerHTML = '';

    var chain = Promise.resolve();
    for (var i = 1; i <= pdfDoc.numPages; i++) {
      (function (num) {
        chain = chain.then(function () {
          return pdfDoc.getPage(num).then(function (page) {
            var base = page.getViewport({ scale: 1 });
            var scale = w / base.width;
            var viewport = page.getViewport({ scale: scale * dpr });

            var wrap = document.createElement('div');
            wrap.className = 'page skeleton';
            wrap.setAttribute('data-page', num);
            wrap.style.height = Math.round(base.height * scale) + 'px';

            var canvas = document.createElement('canvas');
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);
            canvas.style.width = '100%';
            wrap.appendChild(canvas);
            pagesEl.appendChild(wrap);

            var ctx = canvas.getContext('2d', { alpha: false });
            return page.render({ canvasContext: ctx, viewport: viewport }).promise
              .then(function () {
                wrap.classList.remove('skeleton');
                wrap.style.height = 'auto';
                progress.style.width = Math.round(num / pdfDoc.numPages * 100) + '%';
              });
          });
        });
      })(i);
    }

    chain.then(function () {
      rendering = false;
      hideStatus();
      progress.style.width = '100%';
      setTimeout(function () { progress.style.width = '0%'; }, 700);
    }).catch(function (err) {
      rendering = false;
      console.warn(err);
      nativeFallback();
      hideStatus();
    });
  }

  function boot() {
    if (typeof pdfjsLib === 'undefined') {
      nativeFallback();
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_FROM_CDN
      ? 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'
      : 'vendor/pdf.worker.min.js';

    // 依次尝试镜像（jsDelivr 快），全部失败则回退本站
    function fetchWithProgress(url, timeoutMs) {
      return new Promise(function (resolve, reject) {
        var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctrl) ctrl.abort(); reject(new Error('timeout')); }, timeoutMs);
        fetch(url, ctrl ? { signal: ctrl.signal } : {}).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var total = parseInt(res.headers.get('content-length') || '0', 10);
          if (!res.body || !res.body.getReader) return res.arrayBuffer();
          var reader = res.body.getReader();
          var chunks = [];
          var loaded = 0;
          function pump() {
            return reader.read().then(function (r) {
              if (r.done) {
                var out = new Uint8Array(loaded);
                var off = 0;
                chunks.forEach(function (c) { out.set(c, off); off += c.length; });
                return out;
              }
              chunks.push(r.value);
              loaded += r.value.length;
              if (total > 0) statusTxt.textContent = '正在加载简历… ' + Math.round(loaded / total * 100) + '%';
              return pump();
            });
          }
          return pump();
        }).then(function (data) {
          clearTimeout(timer);
          resolve(data);
        }).catch(function (e) {
          clearTimeout(timer);
          reject(e);
        });
      });
    }

    function loadDoc(i) {
      if (i >= PDF_MIRRORS.length) return Promise.reject(new Error('all sources failed'));
      return fetchWithProgress(PDF_MIRRORS[i], 9000).then(function (data) {
        return pdfjsLib.getDocument({
          data: data instanceof Uint8Array ? data : new Uint8Array(data)
        }).promise;
      }).catch(function (e) {
        console.warn('加载失败，切换下一个源：' + PDF_MIRRORS[i], e);
        return loadDoc(i + 1);
      });
    }

    loadDoc(0).then(function (doc) {
      pdfDoc = doc;
      counter.hidden = false;
      counter.textContent = '共 ' + doc.numPages + ' 页';
      totalEl.textContent = doc.numPages;
      statusTxt.textContent = '正在排版…';
      renderAll();
    }).catch(function (err) {
      console.warn(err);
      nativeFallback();
      hideStatus();
    });
  }

  /* 简单滚动提示：当前页 */
  window.addEventListener('scroll', function () {
    if (!pdfDoc) return;
    var mid = window.innerHeight / 2;
    var nodes = pagesEl.children;
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      if (r.top <= mid && r.bottom >= mid) {
        counter.textContent = (i + 1) + ' / ' + pdfDoc.numPages;
        break;
      }
    }
  }, { passive: true });

  window.addEventListener('resize', function () {
    if (!pdfDoc) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var top = window.scrollY;
      renderAll();
      window.scrollTo(0, top);
    }, 320);
  });

  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);

  /* 25 秒仍未完成则启用兜底 */
  setTimeout(function () {
    if (!pdfDoc) { nativeFallback(); hideStatus(); }
  }, 25000);
})();
</script>
</body>
</html>
